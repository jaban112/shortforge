[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortforge"
version = "1.2.0"
description = "Unattended faceless Shorts factory: grounded data -> verified script -> local TTS -> ffmpeg -> YouTube"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "soundfile>=0.12",
    "kokoro-onnx>=0.4",
    "onnxruntime>=1.17",
    "pillow>=10",
    "cryptography>=41",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
shortforge = "shortforge.__main__:main"

[tool.setuptools.packages.find]
include = ["shortforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
