name: shortforge stats

on:
  schedule:
    - cron: "30 5 * * *"   # daily snapshot -> exact 90-day Shorts-view window in status/
  workflow_dispatch:

concurrency:
  group: shortforge-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      SHORTFORGE_UPLOADER: ${{ vars.SHORTFORGE_UPLOADER || 'youtube' }}
      IG_USER_ID: ${{ vars.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_TOKEN_KEY: ${{ secrets.IG_TOKEN_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m shortforge stats
      - if: contains(env.SHORTFORGE_UPLOADER, 'instagram')
        run: python -m shortforge ig-refresh
      - name: Commit
        run: |
          git config user.name "shortforge-bot"
          git config user.email "shortforge-bot@users.noreply.github.com"
          git add state status
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "shortforge: stats [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
